name: CI / Test & Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm run install:all

      - name: Run Server Unit & Integration Tests (Vitest)
        run: npm test

      - name: Compile and Build (Client & Server)
        run: npm run build

