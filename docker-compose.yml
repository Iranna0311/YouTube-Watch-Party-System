version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: watchparty-redis
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  server1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: watchparty-node-1
    ports:
      - '4001:4000'
    environment:
      - PORT=4000
      - REDIS_URL=redis://redis:6379
      - CLIENT_ORIGIN=*
    depends_on:
      redis:
        condition: service_healthy

  server2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: watchparty-node-2
    ports:
      - '4002:4000'
    environment:
      - PORT=4000
      - REDIS_URL=redis://redis:6379
      - CLIENT_ORIGIN=*
    depends_on:
      redis:
        condition: service_healthy

